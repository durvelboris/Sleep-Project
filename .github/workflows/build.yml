name: Compiler le 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        run: make

      - name: Publier le .3dsx
        uses: actions/upload-artifact@v4
        with:
          name: SleepButton
          path: SleepButton.3dsx
